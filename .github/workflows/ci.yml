name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ./TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  integration:
    name: Oracle integration tests
    runs-on: ubuntu-latest
    needs: build-test
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_RANDOM_PASSWORD: "yes"
          APP_USER: media_app
          APP_USER_PASSWORD: media_app_test_pw
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 180s
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Create schema
        run: |
          {
            echo "WHENEVER SQLERROR EXIT FAILURE"
            cat database/schema.sql
          } | docker exec -i "${{ job.services.oracle.id }}" \
            sqlplus -s -L "media_app/media_app_test_pw@//localhost:1521/FREEPDB1"

      - name: Run repository integration tests
        env:
          MEDIATRACKER_TEST_DB: "1"
          ConnectionStrings__OracleDb: "User Id=media_app;Password=media_app_test_pw;Data Source=localhost:1521/FREEPDB1"
        run: >
          dotnet test MediaTracker.Api.Tests
          --no-build --configuration Release
          --filter "FullyQualifiedName~RepositoryIntegrationTests"
